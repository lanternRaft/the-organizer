<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Organizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#1a1a2e" />
  </svg>
  <div class="info" id="info">Click an element to select it</div>

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="select" title="Select">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M5 2 L5 18 L9 14 L13 18 L15 16 L11 12 L16 12 Z" fill="currentColor"/>
      </svg>
      <span>Select</span>
    </button>
    <div id="shape-tool-wrap">
      <button class="tool-btn" data-tool="shape" title="Shape">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <ellipse cx="10" cy="10" rx="8" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span id="shape-label">Oval</span>
      </button>
      <div id="shape-dropdown">
        <div class="shape-option" data-mode="oval">Oval</div>
        <div class="shape-option" data-mode="circle">Circle</div>
      </div>
    </div>

    <button class="tool-btn" data-tool="arrow" title="Arrow">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <line x1="3" y1="17" x2="17" y2="3" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Arrow</span>
    </button>
  </div>

  <div id="legend"></div>

  <div id="ctx-menu">
    <div class="ctx-title">Change Color</div>
    <div class="ctx-color" data-color="#3b82f6"><span class="ctx-swatch" style="background:#3b82f6"></span> Blue</div>
    <div class="ctx-color" data-color="#ef4444"><span class="ctx-swatch" style="background:#ef4444"></span> Red</div>
    <div class="ctx-color" data-color="#22c55e"><span class="ctx-swatch" style="background:#22c55e"></span> Green</div>
    <div class="ctx-color" data-color="#f59e0b"><span class="ctx-swatch" style="background:#f59e0b"></span> Yellow</div>
    <div class="ctx-color" data-color="#a855f7"><span class="ctx-swatch" style="background:#a855f7"></span> Purple</div>
    <div class="ctx-color" data-color="#ec4899"><span class="ctx-swatch" style="background:#ec4899"></span> Pink</div>
    <div class="ctx-color" data-color="#ffffff"><span class="ctx-swatch" style="background:#ffffff; border-color:#94a3b8"></span> White</div>
    <div class="ctx-color" data-color="#1e293b"><span class="ctx-swatch" style="background:#1e293b"></span> Dark</div>

    <div class="ctx-divider"></div>

    <div class="ctx-action ctx-delete" data-action="delete">
      <span class="ctx-delete-icon">🗑</span> Delete
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
