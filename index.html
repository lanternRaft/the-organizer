<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click to Place Blue Ovals</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      font-family: sans-serif;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      user-select: none;
      pointer-events: none;
    }

    /* ── Context menu ───────────────────────────────── */
    #ctx-menu {
      display: none;
      position: fixed;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 0;
      min-width: 130px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000;
      font-family: sans-serif;
      user-select: none;
    }
    #ctx-menu .ctx-title {
      padding: 6px 14px;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: default;
    }
    #ctx-menu .ctx-color {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: #e2e8f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    #ctx-menu .ctx-color:hover {
      background: #334155;
    }
    #ctx-menu .ctx-swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#1a1a2e" />
  </svg>
  <div class="info">Click anywhere to place a blue oval</div>

  <div id="ctx-menu">
    <div class="ctx-title">Change Color</div>
    <div class="ctx-color" data-color="#3b82f6"><span class="ctx-swatch" style="background:#3b82f6"></span> Blue</div>
    <div class="ctx-color" data-color="#ef4444"><span class="ctx-swatch" style="background:#ef4444"></span> Red</div>
    <div class="ctx-color" data-color="#22c55e"><span class="ctx-swatch" style="background:#22c55e"></span> Green</div>
    <div class="ctx-color" data-color="#f59e0b"><span class="ctx-swatch" style="background:#f59e0b"></span> Yellow</div>
    <div class="ctx-color" data-color="#a855f7"><span class="ctx-swatch" style="background:#a855f7"></span> Purple</div>
    <div class="ctx-color" data-color="#ec4899"><span class="ctx-swatch" style="background:#ec4899"></span> Pink</div>
    <div class="ctx-color" data-color="#ffffff"><span class="ctx-swatch" style="background:#ffffff; border-color:#94a3b8"></span> White</div>
    <div class="ctx-color" data-color="#1e293b"><span class="ctx-swatch" style="background:#1e293b"></span> Dark</div>
  </div>

  <script>
    const svg = document.getElementById('canvas');
    const bgRect = svg.querySelector('rect');

    let selected = null;
    const handles = [];
    const HANDLE_SIZE = 10;
    const INFO = document.querySelector('.info');
    const ctxMenu = document.getElementById('ctx-menu');

    // ── Helpers ──────────────────────────────────────────────

    function getPos(e) {
      const r = svg.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function ellipseAttrs(el) {
      return {
        cx: parseFloat(el.getAttribute('cx')),
        cy: parseFloat(el.getAttribute('cy')),
        rx: parseFloat(el.getAttribute('rx')),
        ry: parseFloat(el.getAttribute('ry')),
      };
    }

    function selectEllipse(el) {
      deselect();
      if (!el) return;
      selected = el;
      el.setAttribute('stroke', '#fbbf24');
      el.setAttribute('stroke-width', '3');
      showHandles(el);
      INFO.textContent = 'Drag a corner handle to resize';
    }

    function deselect() {
      if (selected) {
        selected.setAttribute('stroke', '#60a5fa');
        selected.setAttribute('stroke-width', '2');
        selected = null;
      }
      removeHandles();
      hideContextMenu();
      INFO.textContent = 'Click anywhere to place a blue oval, or click an oval to select it';
    }

    // ── Context menu ────────────────────────────────────────

    function showContextMenu(x, y) {
      ctxMenu.style.display = 'block';
      ctxMenu.style.left = x + 'px';
      ctxMenu.style.top = y + 'px';
    }

    function hideContextMenu() {
      ctxMenu.style.display = 'none';
    }

    // Click a color in the context menu
    ctxMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.ctx-color');
      if (!item || !selected) return;
      const color = item.getAttribute('data-color');
      selected.setAttribute('fill', color);
      hideContextMenu();
    });

    // Hide menu on any click outside
    document.addEventListener('click', (e) => {
      if (ctxMenu.contains(e.target)) return;
      hideContextMenu();
    });

    // Hide menu on right-click outside
    document.addEventListener('contextmenu', (e) => {
      if (ctxMenu.contains(e.target)) return;
      hideContextMenu();
    });

    // Hide menu on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideContextMenu();
    });

    // ── Handles ──────────────────────────────────────────────

    function removeHandles() {
      handles.forEach(h => h.el.remove());
      handles.length = 0;
    }

    function showHandles(el) {
      removeHandles();
      const { cx, cy, rx, ry } = ellipseAttrs(el);
      const corners = [
        { x: cx - rx, y: cy - ry, cursor: 'nwse-resize' },
        { x: cx + rx, y: cy - ry, cursor: 'nesw-resize' },
        { x: cx - rx, y: cy + ry, cursor: 'nesw-resize' },
        { x: cx + rx, y: cy + ry, cursor: 'nwse-resize' },
      ];

      corners.forEach((c) => {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', c.x - HANDLE_SIZE / 2);
        rect.setAttribute('y', c.y - HANDLE_SIZE / 2);
        rect.setAttribute('width', HANDLE_SIZE);
        rect.setAttribute('height', HANDLE_SIZE);
        rect.setAttribute('fill', '#ffffff');
        rect.setAttribute('stroke', '#3b82f6');
        rect.setAttribute('stroke-width', '2');
        rect.setAttribute('cursor', c.cursor);
        rect.classList.add('resize-handle');
        svg.appendChild(rect);

        const data = { el: rect };
        handles.push(data);

        // ── Drag resize ──
        rect.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (!selected) return;

          const { cx, cy } = ellipseAttrs(selected);

          function onMove(me) {
            const pos = getPos(me);
            const newRx = Math.max(10, Math.abs(pos.x - cx));
            const newRy = Math.max(10, Math.abs(pos.y - cy));
            selected.setAttribute('rx', newRx);
            selected.setAttribute('ry', newRy);
            showHandles(selected);
          }

          function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      });
    }

    // ── Create oval ──────────────────────────────────────────

    function createOval(x, y) {
      const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      ellipse.setAttribute('cx', x);
      ellipse.setAttribute('cy', y);
      ellipse.setAttribute('rx', 40);
      ellipse.setAttribute('ry', 25);
      ellipse.setAttribute('fill', '#3b82f6');
      ellipse.setAttribute('opacity', '0.9');
      ellipse.setAttribute('stroke', '#60a5fa');
      ellipse.setAttribute('stroke-width', '2');
      ellipse.style.cursor = 'pointer';

      // Click on oval → select it (stop propagation so svg click doesn't fire)
      ellipse.addEventListener('click', (e) => {
        e.stopPropagation();
        selectEllipse(ellipse);
      });

      // Right-click on oval → show context menu
      ellipse.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        selectEllipse(ellipse);
        showContextMenu(e.clientX, e.clientY);
      });

      svg.appendChild(ellipse);
      return ellipse;
    }

    // ── SVG background click ─────────────────────────────────

    svg.addEventListener('click', (e) => {
      // Only handle clicks directly on the svg or the background rect
      if (e.target !== svg && e.target !== bgRect) return;

      const pos = getPos(e);
      deselect();
      createOval(pos.x, pos.y);
    });
  </script>
</body>
</html>
