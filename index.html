<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Organizer</title>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
  </svg>
  <button id="grid-toggle" title="Toggle background grid">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
    </svg>
  </button>
  <button id="theme-toggle" title="Toggle dark/light mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
  <!-- ── Hamburger menu ── -->
  <button id="menu-btn" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- ── Menu dropdown ── -->
  <div id="menu-dropdown">
    <button id="menu-export-png-btn">Export PNG</button>
    <button id="menu-clear-btn">Clear</button>
  </div>

  <!-- ── Confirmation dialog overlay ── -->
  <div id="confirm-overlay" class="confirm-overlay">
    <div id="confirm-dialog" class="confirm-dialog">
      <div class="confirm-title">Clear Canvas</div>
      <div class="confirm-msg">This will delete everything on the canvas. This cannot be undone.</div>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="confirm-btn confirm-cancel">Cancel</button>
        <button id="confirm-ok" class="confirm-btn confirm-ok">Clear</button>
      </div>
    </div>
  </div>

  <div class="info" id="info">Click an element to select it</div>

  <!-- ── Zoom controls ── -->
  <div id="zoom-controls">
    <button id="zoom-in" title="Zoom in (Ctrl+=)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="zoom-out" title="Zoom out (Ctrl+-)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="zoom-reset" title="Reset zoom (Ctrl+0)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
      </svg>
    </button>
  </div>

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="select" title="Select">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M5 2 L5 18 L9 14 L13 18 L15 16 L11 12 L16 12 Z" fill="currentColor"/>
      </svg>
      <span>Select</span>
    </button>
    <div id="shape-tool-wrap">
      <button class="tool-btn" data-tool="shape" title="Shape">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <ellipse cx="10" cy="10" rx="8" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span id="shape-label">Oval</span>
      </button>
      <div id="shape-dropdown">
        <div class="shape-option" data-mode="oval">Oval</div>
        <div class="shape-option" data-mode="circle">Circle</div>
      </div>
    </div>

    <button class="tool-btn" data-tool="node" title="Node">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Node</span>
    </button>
  </div>

  <div id="legend"></div>

  <div id="selection-menu">
    <button class="sel-btn sel-delete" title="Delete">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
    <button class="sel-btn sel-palette" title="Change color">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="1" fill="currentColor"></circle>
        <circle cx="17.5" cy="10.5" r="1" fill="currentColor"></circle>
        <circle cx="8.5" cy="7.5" r="1" fill="currentColor"></circle>
        <circle cx="6.5" cy="12.5" r="1" fill="currentColor"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.7 0 1-.3 1-.9v-1.1c0-.4.3-.8.8-.8h.9c.4 0 .8-.3.8-.8v-.9c0-.4.3-.8.8-.8h1.1c.4 0 .8-.3.8-.8v-1.4c0-.4.3-.8.8-.8h.9c.4 0 .8-.3.8-.8V12c0-5.5-4.5-10-10-10z"></path>
      </svg>
    </button>
    <div class="sel-separator"></div>
    <button class="sel-btn sel-curve" title="Curve mode — click path to add bend points" data-curve="on">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20 Q 8 4 21 15"></path>
        <circle cx="3" cy="20" r="1.5" fill="currentColor"></circle>
        <circle cx="21" cy="15" r="1.5" fill="currentColor"></circle>
      </svg>
    </button>
    <div class="sel-separator"></div>
    <button class="sel-btn sel-dir-none" title="No arrowhead" data-dir="none">
      <svg width="14" height="8" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="1" y1="4" x2="13" y2="4"></line>
      </svg>
    </button>
    <button class="sel-btn sel-dir-mono active-dir" title="Single arrowhead" data-dir="mono">
      <svg width="14" height="8" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="4" x2="10" y2="4"></line>
        <polyline points="7,1 12,4 7,7"></polyline>
      </svg>
    </button>
    <button class="sel-btn sel-dir-dual" title="Double arrowhead" data-dir="dual">
      <svg width="14" height="8" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3,1 1,4 3,7"></polyline>
        <line x1="1" y1="4" x2="13" y2="4"></line>
        <polyline points="11,1 13,4 11,7"></polyline>
      </svg>
    </button>
    <div id="color-palette-popup">
      <div class="palette-title">Change Color</div>
      <div class="palette-colors">
        <div class="palette-swatch" data-color="#3b82f6" style="background:#3b82f6"></div>
        <div class="palette-swatch" data-color="#ef4444" style="background:#ef4444"></div>
        <div class="palette-swatch" data-color="#22c55e" style="background:#22c55e"></div>
        <div class="palette-swatch" data-color="#f59e0b" style="background:#f59e0b"></div>
        <div class="palette-swatch" data-color="#a855f7" style="background:#a855f7"></div>
        <div class="palette-swatch" data-color="#ec4899" style="background:#ec4899"></div>
        <div class="palette-swatch" data-color="#ffffff" style="background:#ffffff; border-color:#94a3b8"></div>
        <div class="palette-swatch" data-color="#1e293b" style="background:#1e293b"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
