<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Organizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#1a1a2e" />
  </svg>
  <div class="info" id="info">Click an element to select it</div>

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="select" title="Select">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M5 2 L5 18 L9 14 L13 18 L15 16 L11 12 L16 12 Z" fill="currentColor"/>
      </svg>
      <span>Select</span>
    </button>
    <div id="shape-tool-wrap">
      <button class="tool-btn" data-tool="shape" title="Shape">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <ellipse cx="10" cy="10" rx="8" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span id="shape-label">Oval</span>
      </button>
      <div id="shape-dropdown">
        <div class="shape-option" data-mode="oval">Oval</div>
        <div class="shape-option" data-mode="circle">Circle</div>
      </div>
    </div>

    <button class="tool-btn" data-tool="arrow" title="Arrow">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <line x1="3" y1="17" x2="17" y2="3" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Arrow</span>
    </button>
  </div>

  <div id="legend"></div>

  <div id="selection-menu">
    <button class="sel-btn sel-delete" title="Delete">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
    <button class="sel-btn sel-palette" title="Change color">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="1" fill="currentColor"></circle>
        <circle cx="17.5" cy="10.5" r="1" fill="currentColor"></circle>
        <circle cx="8.5" cy="7.5" r="1" fill="currentColor"></circle>
        <circle cx="6.5" cy="12.5" r="1" fill="currentColor"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.7 0 1-.3 1-.9v-1.1c0-.4.3-.8.8-.8h.9c.4 0 .8-.3.8-.8v-.9c0-.4.3-.8.8-.8h1.1c.4 0 .8-.3.8-.8v-1.4c0-.4.3-.8.8-.8h.9c.4 0 .8-.3.8-.8V12c0-5.5-4.5-10-10-10z"></path>
      </svg>
    </button>
    <div id="color-palette-popup">
      <div class="palette-title">Change Color</div>
      <div class="palette-colors">
        <div class="palette-swatch" data-color="#3b82f6" style="background:#3b82f6"></div>
        <div class="palette-swatch" data-color="#ef4444" style="background:#ef4444"></div>
        <div class="palette-swatch" data-color="#22c55e" style="background:#22c55e"></div>
        <div class="palette-swatch" data-color="#f59e0b" style="background:#f59e0b"></div>
        <div class="palette-swatch" data-color="#a855f7" style="background:#a855f7"></div>
        <div class="palette-swatch" data-color="#ec4899" style="background:#ec4899"></div>
        <div class="palette-swatch" data-color="#ffffff" style="background:#ffffff; border-color:#94a3b8"></div>
        <div class="palette-swatch" data-color="#1e293b" style="background:#1e293b"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
